name: Ball2Box browser test build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:3.6.2
    steps:
      - uses: actions/checkout@v4

      - name: Install virtual display
        run: |
          apt-get update
          apt-get install -y xvfb

      - name: Import resources
        timeout-minutes: 5
        run: |
          cd game
          timeout 240s xvfb-run -a godot --editor --quit

      - name: Export HTML5
        timeout-minutes: 5
        run: |
          mkdir -p web
          cd game
          xvfb-run -a godot --export "HTML5" ../web/index.html

      - name: Upload browser test artifact
        uses: actions/upload-artifact@v4
        with:
          name: ball2box-html5-test
          path: web/
          if-no-files-found: error
