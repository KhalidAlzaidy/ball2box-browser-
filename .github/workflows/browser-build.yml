name: Ball2Box browser test build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:3.6.2
    steps:
      - uses: actions/checkout@v4

      
      - name: Install HTML5 export templates
        run: |
          apt-get update
          apt-get install -y python3 ca-certificates wget
          mkdir -p /root/.local/share/godot/templates/3.6.2.stable
          wget -q https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_export_templates.tpz -O /tmp/templates.tpz
          python3 -c "import zipfile; z=zipfile.ZipFile('/tmp/templates.tpz'); z.extract('templates/webassembly_debug.zip', '/tmp'); z.extract('templates/webassembly_release.zip', '/tmp')"
          cp /tmp/templates/webassembly_*.zip /root/.local/share/godot/templates/3.6.2.stable/


      - name: Install virtual display
        run: |
          apt-get update
          apt-get install -y xvfb
      - name: Import game resources
        timeout-minutes: 5
        run: |
          cd game
          timeout 240s xvfb-run -a godot --editor --quit
      - name: Export HTML5
        timeout-minutes: 5
        run: |
          mkdir -p web
          cd game
          timeout 240s xvfb-run -a godot --export "HTML5" ../web/index.html

      - name: Upload browser test artifact
        uses: actions/upload-artifact@v4
        with:
          name: ball2box-html5-test
          path: web/
          if-no-files-found: error
