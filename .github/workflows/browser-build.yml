
name: Ball2Box browser test build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: barichello/godot-ci:3.6.2

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -eu
          apt-get update
          apt-get install -y python3 ca-certificates wget xvfb

      - name: Install HTML5 export templates
        run: |
          set -eu
          mkdir -p /root/.local/share/godot/templates/3.6.2.stable
          wget -q https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_export_templates.tpz -O /tmp/templates.tpz
          python3 -c "import zipfile; z=zipfile.ZipFile('/tmp/templates.tpz'); z.extract('templates/webassembly_debug.zip', '/tmp'); z.extract('templates/webassembly_release.zip', '/tmp')"
          cp /tmp/templates/webassembly_*.zip /root/.local/share/godot/templates/3.6.2.stable/
          test -s /root/.local/share/godot/templates/3.6.2.stable/webassembly_release.zip

      
      - name: Diagnose Godot resource import
        timeout-minutes: 3
        shell: bash
        run: |
          set -o pipefail
          cd game

          echo "Checking original football model..."
          test -s assets/obj/Football.blend.obj || exit 1

          echo "Starting Godot with GLES2..."
          set +e
          timeout 90s xvfb-run -a godot \
            --path . \
            --video-driver Dummy \
            --editor \
            --quit \
            --verbose > ../godot-diagnostic.log 2>&1
          result=$?
          set -e

          echo "Godot exit code: $result"
          echo "Last 60 log lines:"
          tail -n 60 ../godot-diagnostic.log

          echo "Imported football mesh:"
          find .import -name 'Football.blend.obj*.mesh' \
            -print 2>/dev/null || true

          if [ "$result" -ne 0 ]; then
            exit "$result"
          fi

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-diagnostic
          path: godot-diagnostic.log
          if-no-files-found: warn
